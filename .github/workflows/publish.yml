name: Publish

on:
  schedule:
    - cron: '0 2 * * 1,3,5'
  workflow_dispatch:
  repository_dispatch:
    types: [extension-released, azd-web-core-updated]

permissions:
  contents: write
  packages: read

concurrency:
  group: 'publish'
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update registry
        run: node scripts/update-registry.js

      - name: Validate registry
        run: node scripts/validate-registry.js

      - name: Update README versions
        run: node scripts/update-readme-versions.js

      - name: Build
        run: pnpm run build

      - name: Commit registry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/registry.json README.md
          if git diff --cached --quiet; then
            echo "No registry changes to commit"
          else
            git commit -m "chore: update extension registry"
            git push
          fi

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages branch
          git clone --branch gh-pages --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" _gh_pages
          cd _gh_pages

          # Remove old production files (keep pr/ directory for previews)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'pr' -exec rm -rf {} +

          # Copy new build
          cp -r ../dist/* .
          touch .nojekyll

          # Commit and push
          git add -A
          git commit -m "Deploy production website" --allow-empty
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
