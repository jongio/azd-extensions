name: Spell Check

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '**/*.md'
      - 'package.json'
      - '.cspell.json'
      - '.github/workflows/spellcheck.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '**/*.md'
      - 'package.json'
      - '.cspell.json'
      - '.github/workflows/spellcheck.yml'

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          files: |
            **/*.{ts,tsx,js,jsx,md,json}
          config: .cspell.json
          strict: false
