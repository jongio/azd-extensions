name: invalid-legacy-promote-hooks
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      executable: publish
  hooks:
    build:
      executable: pnpm
      args: [build]
      timeout: 30m
