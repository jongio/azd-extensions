name: invalid-snapshot-unknown-template-token
promote:
  chains:
    release:
      targets: [prod]
  environments:
    prod:
      provider: publisher
      artifacts: [site]
      gitSnapshot:
        mode: publish
        refs:
          - kind: tag
            template: refs/tags/releases/{gitSha}/{unknown}
  artifacts:
    site: { type: static, path: dist }
  providers:
    publisher: { type: process, executable: publish, timeout: 5m }
