name: invalid-unknown-nested-property
promote:
  project:
    id: invalidUnknownNestedProperty
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
      unexpected: true
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
