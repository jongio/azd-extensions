name: invalid-legacy-previous-run
promote:
  chains:
    release:
      targets: [dev, prod]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
    prod:
      provider: localPublisher
      artifacts: [site]
      previousRun:
        files:
          - .azure/promote/verification/dev-content.json
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
