name: invalid-compound-command-timeout
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
  artifacts:
    site: { type: static, path: dist }
  providers:
    local-publisher:
      type: process
      executable: publish
      timeout: 5m
  commands:
    inspect-target:
      executable: inspect
      timeout: 1m30s
