name: invalid-promote-version
promote:
  version: 4
  project:
    id: invalidPromoteVersion
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
