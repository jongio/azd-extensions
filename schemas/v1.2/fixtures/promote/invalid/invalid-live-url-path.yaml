name: invalid-live-url-path
promote:
  project:
    id: invalidLiveUrlPath
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
      liveFiles:
        - path: search-index.json
          urlPath: search-index.json
  providers:
    localPublisher:
      type: process
      command: publish
