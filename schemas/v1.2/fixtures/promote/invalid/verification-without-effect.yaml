name: invalid-verification-without-effect
promote:
  project:
    id: invalidVerificationWithoutEffect
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
      hooks:
        before: [verifyTarget]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
  hooks:
    verifyTarget:
      command: pnpm
      verification:
        path: verification/target.json
      timeout: 5m
