name: invalid-verification-without-effect
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
      steps:
        verify:
          - use: verifyTarget
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
  commands:
    verifyTarget:
      command: pnpm
      verification:
        path: verification/target.json
      timeout: 5m
