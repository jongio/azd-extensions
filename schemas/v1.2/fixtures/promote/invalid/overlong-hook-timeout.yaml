name: invalid-overlong-hook-timeout
promote:
  project:
    id: invalidOverlongHookTimeout
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
  hooks:
    inspectTarget:
      command: pnpm
      timeout: 2h
