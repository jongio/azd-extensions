name: invalid-legacy-target-hooks
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
      hooks:
        before: [build]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      executable: publish
  commands:
    build:
      executable: pnpm
      args: [build]
      timeout: 30m
