name: invalid-legacy-target-hooks
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
      hooks:
        before: [build]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
  commands:
    build:
      command: pnpm
      args: [build]
      timeout: 30m
