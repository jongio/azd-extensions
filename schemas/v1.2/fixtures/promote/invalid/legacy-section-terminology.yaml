name: invalid-legacy-section-terminology
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
      workflow:
        prepare:
          - section: file-prep
  artifacts:
    site:
      type: static
      path: dist
  providers:
    publisher:
      type: process
      executable: publish
  sections:
    file-prep:
      steps:
        - command: build
  commands:
    build:
      executable: build
      timeout: 5m
