name: invalid-legacy-underscore-keys
promote:
  project:
    id: invalidLegacyKeys
  default_chain: release
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
      candidate:
        require_clean: true
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
