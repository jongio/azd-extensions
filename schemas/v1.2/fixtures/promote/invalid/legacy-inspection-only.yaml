name: invalid-legacy-inspection-only
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
  artifacts:
    site: { type: static, path: dist }
  providers:
    publisher: { type: process, executable: publish, timeout: 5m }
  commands:
    inspect-target:
      effect: inspection
      executable: inspect
      inspectionOnly: true
      timeout: 5m
