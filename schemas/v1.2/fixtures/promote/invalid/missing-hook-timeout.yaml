name: invalid-missing-hook-timeout
promote:
  project:
    id: invalidMissingHookTimeout
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
  hooks:
    inspectTarget:
      command: pnpm
