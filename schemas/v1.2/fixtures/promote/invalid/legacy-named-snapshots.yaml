name: invalid-legacy-named-snapshots
promote:
  chains:
    release:
      targets: [staging]
  snapshots:
    stagingRelease:
      purpose: verifiedStaging
      mode: publish
      refs:
        - kind: branch
          ref: refs/heads/environments/staging
  environments:
    staging:
      provider: local-publisher
      artifacts: [site]
      snapshot: stagingRelease
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      executable: publish
