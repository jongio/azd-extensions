name: invalid-raw-auth-secret
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
      auth:
        type: basic
        username: BASIC_AUTH_USERNAME
        password: BASIC_AUTH_PASSWORD
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      command: publish
