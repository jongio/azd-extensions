name: invalid-verification-import-path
promote:
  chains:
    release:
      targets: [dev, prod]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
    prod:
      provider: localPublisher
      artifacts: [site]
      requires:
        previous:
          verifications:
            - .azure/promote/verification/dev-content.json
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
