name: invalid-verification-effect-without-record
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
      steps:
        verify:
          - use: verify-target
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      command: publish
  commands:
    verify-target:
      effect: verification
      command: pnpm
      timeout: 5m
