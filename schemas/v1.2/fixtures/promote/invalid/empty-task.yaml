name: invalid-empty-task
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
      workflow:
        prepare:
          - task: empty
  artifacts:
    site:
      type: static
      path: dist
  providers:
    publisher:
      type: process
      executable: publish
  tasks:
    empty:
      steps: []
