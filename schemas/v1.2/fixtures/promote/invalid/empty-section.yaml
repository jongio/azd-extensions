name: invalid-empty-section
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
      workflow:
        prepare:
          - section: empty
  artifacts:
    site:
      type: static
      path: dist
  providers:
    publisher:
      type: process
      command: publish
  sections:
    empty:
      steps: []
