name: invalid-legacy-global-approvals
promote:
  chains:
    release:
      targets: [dev]
  approvals:
    targets: [dev]
    message: Approve dev
    match: PROMOTE
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
