name: invalid-tokenized-sealed-path
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
      sealedPaths:
        - .azure/promote/verification/{target}-selection.json
  providers:
    publisher:
      type: process
      executable: publish
      timeout: 5m
