name: invalid-missing-cloudflare-config
promote:
  project:
    id: invalidMissingCloudflareConfig
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: cloudflare
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    cloudflare:
      type: cloudflareWorker
