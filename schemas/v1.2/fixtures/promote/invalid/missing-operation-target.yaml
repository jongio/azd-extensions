name: invalid-missing-operation-target
promote:
  chains:
    release:
      targets: [prod]
  environments:
    prod:
      provider: localPublisher
      artifacts: [site]
  operations:
    validateContent:
      provider: validator
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
    validator:
      type: process
      command: validate
