name: invalid-legacy-promote-results
promote:
  chains:
    release:
      targets: [dev]
  results:
    path: .azure/promote/results/{target}/{artifact}.json
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
