name: invalid-nested-section
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
      workflow:
        prepare:
          - section: outer
  artifacts:
    site:
      type: static
      path: dist
  providers:
    publisher:
      type: process
      command: publish
  sections:
    outer:
      steps:
        - section: inner
    inner:
      steps:
        - use: build
  commands:
    build:
      command: build
      timeout: 5m
