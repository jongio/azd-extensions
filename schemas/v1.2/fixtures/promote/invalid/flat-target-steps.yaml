name: invalid-flat-target-steps
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: publisher
      artifacts: [site]
      steps:
        prepare:
          - command: build
  artifacts:
    site:
      type: static
      path: dist
  providers:
    publisher:
      type: process
      executable: publish
  commands:
    build:
      executable: build
      timeout: 5m
