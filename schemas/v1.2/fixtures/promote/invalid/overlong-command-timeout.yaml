name: invalid-overlong-command-timeout
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      executable: publish
  commands:
    inspect-target:
      executable: pnpm
      timeout: 2h
