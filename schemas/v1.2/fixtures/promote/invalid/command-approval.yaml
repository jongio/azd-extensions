name: invalid-command-approval
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: local-publisher
      artifacts: [site]
      workflow:
        change:
          - section: deployment
  artifacts:
    site:
      type: static
      path: dist
  providers:
    local-publisher:
      type: process
      command: publish
  sections:
    deployment:
      steps:
        - use: deploy
  commands:
    deploy:
      effect: change
      command: publish
      timeout: 30m
      approval:
        message: Approve deployment
        match: DEPLOY
