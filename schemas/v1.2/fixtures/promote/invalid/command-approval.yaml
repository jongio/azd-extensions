name: invalid-command-approval
promote:
  chains:
    release:
      targets: [dev]
  environments:
    dev:
      provider: localPublisher
      artifacts: [site]
      steps:
        change:
          - use: deploy
  artifacts:
    site:
      type: static
      path: dist
  providers:
    localPublisher:
      type: process
      command: publish
  commands:
    deploy:
      effect: change
      command: publish
      timeout: 30m
      approval:
        message: Approve deployment
        match: DEPLOY
