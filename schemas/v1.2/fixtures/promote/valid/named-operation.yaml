name: named-promotion-operation
promote:
  chains:
    release:
      targets: [prod]
  git:
    worktree: clean
    upstream: published
    ref:
      exact: origin/main
      refresh: false
  environments:
    prod:
      provider: publisher
      artifacts: [site]
      auth:
        type: headers
        headers:
          X-Release-Token: { azd: RELEASE_TOKEN }
      git:
        ref:
          refresh: true
      approval:
        message: Approve production promotion
        match: PROMOTE
      snapshot:
        mode: publish
        refs:
          - kind: branch
            ref: refs/heads/environments/production
      workflow:
        prepare:
          - section: build-output
            with: { mode: release }
        verify:
          - section: smoke-tests
            with: { suite: full }
        cleanup:
          - section: cleanup-output
  operations:
    validate-content:
      target: prod
      deploy: false
      git:
        worktree: dirtyAllowed
        ref:
          refresh: false
      locks: [content:production-candidate]
      workflow:
        prepare:
          - section: build-output
            with: { mode: preview }
        verify:
          - section: smoke-tests
            with: { suite: fast }
          - section: content-validation
        cleanup:
          - section: cleanup-output
  artifacts:
    site:
      type: static
      path: dist
      sealedPaths:
        - .azure/promote/verification/validate-content-selected-files.json
  providers:
    publisher:
      type: process
      command: node
      args: [scripts/publish-content.mjs, --artifact, '{artifact}', --result, '{result}']
      timeout: 30m
  sections:
    build-output:
      steps:
        - use: build
          with: { mode: '{mode}' }
    smoke-tests:
      steps:
        - use: smoke
          with: { suite: '{suite}' }
    content-validation:
      steps:
        - use: validate-content
    cleanup-output:
      steps:
        - use: clean-output
  commands:
    build:
      command: pnpm
      args: [build, --mode, '{mode}']
      timeout: 30m
    smoke:
      command: pnpm
      args: [test:smoke, --suite, '{suite}']
      timeout: 15m
    validate-content:
      command: node
      args: [scripts/validate-content.mjs, --artifact, '{artifact}']
      timeout: 30m
    clean-output:
      command: node
      args: [scripts/clean-output.mjs]
      timeout: 5m
