name: full-contract
promote:
  chains:
    release:
      default: true
      targets: [dev, staging, prod]

  git:
    worktree: clean
    upstream: published

  artifacts:
    contentApp:
      type: static
      path: dist/content-app
      identityPaths:
        - azure.yaml
        - pnpm-lock.yaml
      sealedPaths:
        - '.azure/promote/verification/{workflow}-selected-files.json'
      liveFiles:
        - path: content-index.json

  providers:
    contentPublisher:
      type: process
      command: node
      args:
        [
          scripts/publish-content-app.mjs,
          --artifact,
          '{artifact}',
          --environment,
          '{environment}',
          --result,
          '{result}',
        ]
      workdir: .
      timeout: 30m
    contentValidator:
      type: process
      command: node
      args:
        [
          scripts/validate-content-app.mjs,
          --artifact,
          '{artifact}',
          --environment,
          '{environment}',
          --result,
          '{result}',
        ]
      workdir: .
      timeout: 30m
    azureFallback:
      type: azd
      args: [--all]
      workdir: infra
      timeout: 30m

  environments:
    dev:
      provider: contentPublisher
      artifacts: [contentApp]
      git:
        worktree: dirtyAllowed
      auth:
        type: basic
        username: { azd: DEV_BASIC_AUTH_USERNAME }
        password: { azd: DEV_BASIC_AUTH_PASSWORD }
      steps:
        prepare:
          - use: verifyAuth
            with: { required: false }
          - use: checkAssetStore
          - use: build
            with: { mode: release }
          - use: pruneOutput
          - use: normalizeOutput
        change:
          - use: migrateData
          - use: publishAssets
          - use: configureAssetCors
        verify:
          - use: verifyData
          - use: verifyOfflineOutput
          - use: selectFiles
          - use: runSmokeTests
            with: { suite: fast }
          - use: verifyLiveSite
        cleanup:
          - use: removeUnusedFiles

    staging:
      provider: contentPublisher
      artifacts: [contentApp]
      auth:
        type: basic
        username: { azd: STAGING_BASIC_AUTH_USERNAME }
        password: { azd: STAGING_BASIC_AUTH_PASSWORD }
      approval:
        message: Approve the exact staging candidate
        match: PROMOTE
        automation: allowed
      snapshot:
        mode: publish
        recovery: manual
        refs:
          - kind: branch
            ref: refs/heads/environments/staging
      steps:
        prepare:
          - use: verifyAuth
            with: { required: true }
          - use: checkAssetStore
          - use: build
            with: { mode: release }
          - use: pruneOutput
          - use: normalizeOutput
        change:
          - use: migrateData
          - use: publishAssets
          - use: configureAssetCors
        verify:
          - use: verifyData
          - use: verifyOfflineOutput
          - use: selectFiles
          - use: runSmokeTests
            with: { suite: full }
          - use: verifyLiveSite
        cleanup:
          - use: removeUnusedFiles

    prod:
      provider: contentPublisher
      artifacts: [contentApp]
      git:
        worktree: clean
        ref:
          exact: origin/main
          refresh: true
      requires:
        previous:
          verifications: [stagingContent, stagingRouting]
      approval:
        message: Approve the exact production candidate
        match: PROMOTE
        automation: allowed
      snapshot:
        mode: publish
        recovery: manual
        refs:
          - kind: tag
            template: refs/tags/releases/{candidate}
      steps:
        prepare:
          - use: verifyPublisherApproval
          - use: verifyAuth
            with: { required: true }
          - use: checkAssetStore
          - use: build
            with: { mode: release }
          - use: pruneOutput
          - use: normalizeOutput
        change:
          - use: prepareProductionData
          - use: prepareProductionRelease
        verify:
          - use: verifyData
          - use: verifyOfflineOutput
          - use: selectFiles
          - use: verifyDeploymentInputs
          - use: runSmokeTests
            with: { suite: full }
          - use: verifyLiveSite
          - use: verifyPublishedContent
        cleanup:
          - use: removeUnusedFiles

  operations:
    publishContent:
      target: prod
      locks: [content:production, deployment:production]
      approval:
        message: Approve publishing the reviewed content
        match: PUBLISH
        automation: denied
      snapshot:
        mode: publish
        recovery: manual
        refs:
          - kind: tag
            template: refs/tags/content/{candidate}
      steps:
        prepare:
          - use: verifyPreparedContent
          - use: verifyAuth
            with: { required: true }
          - use: checkAssetStore
          - use: build
            with: { mode: release }
          - use: pruneOutput
          - use: normalizeOutput
        verify:
          - use: verifyData
          - use: verifyOfflineOutput
          - use: selectFiles
          - use: verifyContentInputs
          - use: runSmokeTests
            with: { suite: full }
          - use: verifyLiveSite
          - use: verifyPublishedContent
        cleanup:
          - use: removeUnusedFiles

    validateContent:
      target: prod
      provider: contentValidator
      locks: [content:production-candidate]
      steps:
        prepare:
          - use: verifyAuth
            with: { required: true }
          - use: checkAssetStore
          - use: build
            with: { mode: preview }
          - use: pruneOutput
          - use: normalizeOutput
        verify:
          - use: verifyData
          - use: verifyOfflineOutput
          - use: selectFiles
        cleanup:
          - use: removeUnusedFiles

    activateContent:
      target: prod
      locks: [content:production, deployment:production]
      approval:
        message: Approve activation of the exact candidate
        match: ACTIVATE
        automation: denied
      snapshot:
        mode: verify
        recovery: manual
        refs:
          - kind: branch
            ref: refs/heads/environments/production
      steps:
        prepare:
          - use: verifyAuth
            with: { required: true }
          - use: checkAssetStore
          - use: build
            with: { mode: release }
          - use: pruneOutput
          - use: normalizeOutput
        verify:
          - use: verifyData
          - use: verifyOfflineOutput
          - use: selectFiles
          - use: verifyContentInputs
          - use: runSmokeTests
            with: { suite: full }
          - use: verifyLiveSite
          - use: verifyPublishedContent
        cleanup:
          - use: removeUnusedFiles

  commands:
    verifyAuth:
      effect: inspection
      command: node
      args: [scripts/verify-credentials.mjs, --required, '{required}']
      inspectionOnly: true
      timeout: 5m

    checkAssetStore:
      command: node
      args: [scripts/check-resource.mjs, content-assets]
      timeout: 5m

    migrateData:
      effect: change
      command: node
      args: [scripts/migrate-data.mjs]
      timeout: 30m

    verifyData:
      effect: verification
      command: node
      args: [scripts/verify-data.mjs, --record, '.azure/promote/verification/{workflow}-data.json']
      verification:
        path: '.azure/promote/verification/{workflow}-data.json'
      timeout: 10m

    build:
      command: node
      args: [scripts/build-content-app.mjs, --mode, '{mode}']
      timeout: 30m

    pruneOutput:
      command: node
      args: [scripts/prune-output.mjs, dist/content-app]
      timeout: 10m

    normalizeOutput:
      command: node
      args: [scripts/normalize-output.mjs, dist/content-app]
      timeout: 10m

    verifyOfflineOutput:
      effect: verification
      command: node
      args:
        [
          scripts/verify-offline-output.mjs,
          --record,
          '.azure/promote/verification/{workflow}-offline-output.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-offline-output.json'
      timeout: 10m

    publishAssets:
      effect: change
      command: node
      args:
        [
          scripts/publish-assets.mjs,
          --source,
          public/assets,
          --target,
          https://assets.example.invalid,
          --export-dir,
          dist/content-app,
          --skip-existing,
        ]
      timeout: 1h

    selectFiles:
      effect: verification
      command: node
      args:
        [
          scripts/select-files.mjs,
          --source,
          public/assets,
          --target,
          https://assets.example.invalid,
          --dry-run,
          --export-dir,
          dist/content-app,
          --selection-record,
          '.azure/promote/verification/{workflow}-selected-files.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-selected-files.json'
      timeout: 1h

    removeUnusedFiles:
      command: node
      args: [scripts/remove-unused-files.mjs, dist/content-app]
      timeout: 10m

    configureAssetCors:
      effect: change
      command: node
      args: [scripts/configure-asset-cors.mjs, content-assets]
      timeout: 10m

    runSmokeTests:
      effect: verification
      command: node
      args:
        [
          scripts/run-smoke-tests.mjs,
          --suite,
          '{suite}',
          --record,
          '.azure/promote/verification/{workflow}-smoke.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-smoke.json'
      timeout: 15m

    verifyLiveSite:
      effect: verification
      command: node
      args:
        [
          scripts/verify-live-site.mjs,
          --record,
          '.azure/promote/verification/{workflow}-live-site.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-live-site.json'
      timeout: 15m

    prepareProductionData:
      effect: change
      command: node
      args: [scripts/prepare-production-data.mjs]
      timeout: 30m

    verifyPublisherApproval:
      effect: verification
      command: node
      args:
        [
          scripts/verify-publisher-approval.mjs,
          --record,
          '.azure/promote/verification/{workflow}-publisher-approval.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-publisher-approval.json'
      timeout: 5m

    prepareProductionRelease:
      effect: change
      command: node
      args: [scripts/prepare-production-release.mjs]
      timeout: 30m

    verifyDeploymentInputs:
      effect: verification
      command: node
      args:
        [
          scripts/verify-deployment-inputs.mjs,
          --record,
          '.azure/promote/verification/{workflow}-deployment-inputs.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-deployment-inputs.json'
      timeout: 10m

    verifyPublishedContent:
      effect: verification
      command: node
      args:
        [
          scripts/verify-published-content.mjs,
          --record,
          '.azure/promote/verification/{workflow}-published-content.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-published-content.json'
      timeout: 10m

    verifyPreparedContent:
      effect: verification
      command: node
      args:
        [
          scripts/verify-prepared-content.mjs,
          --record,
          '.azure/promote/verification/{workflow}-prepared-content.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-prepared-content.json'
      timeout: 10m

    verifyContentInputs:
      effect: verification
      command: node
      args:
        [
          scripts/verify-content-inputs.mjs,
          --record,
          '.azure/promote/verification/{workflow}-content-inputs.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-content-inputs.json'
      timeout: 10m
