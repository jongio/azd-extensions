name: full-contract
promote:
  chains:
    release:
      default: true
      targets: [dev, staging, prod]

  git:
    worktree: clean
    upstream: published

  artifacts:
    content-app:
      type: static
      path: dist/content-app
      identityPaths:
        - azure.yaml
        - pnpm-lock.yaml
      sealedPaths:
        - '.azure/promote/verification/{workflow}-selected-files.json'
      liveFiles:
        - path: content-index.json

  providers:
    content-publisher:
      type: process
      command: node
      args:
        [
          scripts/publish-content-app.mjs,
          --artifact,
          '{artifact}',
          --environment,
          '{environment}',
          --result,
          '{result}',
        ]
      workdir: .
      timeout: 30m
    azure-fallback:
      type: azd
      args: [--all]
      workdir: infra
      timeout: 30m

  environments:
    dev:
      provider: content-publisher
      artifacts: [content-app]
      git:
        worktree: dirtyAllowed
      auth:
        type: basic
        username: { azd: DEV_BASIC_AUTH_USERNAME }
        password: { azd: DEV_BASIC_AUTH_PASSWORD }
      steps:
        prepare:
          - use: verify-auth
            with: { required: false }
          - use: check-asset-store
          - use: build
            with: { mode: release }
          - use: prune-output
          - use: normalize-output
        change:
          - use: migrate-data
          - use: publish-assets
          - use: configure-asset-cors
        verify:
          - use: verify-data
          - use: verify-offline-output
          - use: select-files
          - use: run-smoke-tests
            with: { suite: fast }
          - use: verify-live-site
        cleanup:
          - use: remove-unused-files

    staging:
      provider: content-publisher
      artifacts: [content-app]
      auth:
        type: basic
        username: { azd: STAGING_BASIC_AUTH_USERNAME }
        password: { azd: STAGING_BASIC_AUTH_PASSWORD }
      approval:
        message: Approve the exact staging candidate
        match: PROMOTE
        automation: allowed
      snapshot:
        mode: publish
        recovery: manual
        refs:
          - kind: branch
            ref: refs/heads/environments/staging
      steps:
        prepare:
          - use: verify-auth
            with: { required: true }
          - use: check-asset-store
          - use: build
            with: { mode: release }
          - use: prune-output
          - use: normalize-output
        change:
          - use: migrate-data
          - use: publish-assets
          - use: configure-asset-cors
        verify:
          - use: verify-data
          - use: verify-offline-output
          - use: select-files
          - use: run-smoke-tests
            with: { suite: full }
          - use: verify-live-site
        cleanup:
          - use: remove-unused-files

    prod:
      provider: content-publisher
      artifacts: [content-app]
      git:
        worktree: clean
        ref:
          exact: origin/main
          refresh: true
      requires:
        previous:
          verifications: [staging-content, staging-routing]
      approval:
        message: Approve the exact production candidate
        match: PROMOTE
        automation: allowed
      snapshot:
        mode: publish
        recovery: manual
        refs:
          - kind: tag
            template: refs/tags/releases/{candidate}
      steps:
        prepare:
          - use: verify-publisher-approval
          - use: verify-auth
            with: { required: true }
          - use: check-asset-store
          - use: build
            with: { mode: release }
          - use: prune-output
          - use: normalize-output
        change:
          - use: prepare-production-data
          - use: prepare-production-release
        verify:
          - use: verify-data
          - use: verify-offline-output
          - use: select-files
          - use: verify-deployment-inputs
          - use: run-smoke-tests
            with: { suite: full }
          - use: verify-live-site
          - use: verify-published-content
        cleanup:
          - use: remove-unused-files

  operations:
    publish-content:
      target: prod
      locks: [content:production, deployment:production]
      approval:
        message: Approve publishing the reviewed content
        match: PUBLISH
        automation: denied
      snapshot:
        mode: publish
        recovery: manual
        refs:
          - kind: tag
            template: refs/tags/content/{candidate}
      steps:
        prepare:
          - use: verify-prepared-content
          - use: verify-auth
            with: { required: true }
          - use: check-asset-store
          - use: build
            with: { mode: release }
          - use: prune-output
          - use: normalize-output
        verify:
          - use: verify-data
          - use: verify-offline-output
          - use: select-files
          - use: verify-content-inputs
          - use: run-smoke-tests
            with: { suite: full }
          - use: verify-live-site
          - use: verify-published-content
        cleanup:
          - use: remove-unused-files

    validate-content:
      target: prod
      deploy: false
      locks: [content:production-candidate]
      steps:
        prepare:
          - use: verify-auth
            with: { required: true }
          - use: check-asset-store
          - use: build
            with: { mode: preview }
          - use: prune-output
          - use: normalize-output
        verify:
          - use: verify-data
          - use: verify-offline-output
          - use: select-files
          - use: validate-content
        cleanup:
          - use: remove-unused-files

    activate-content:
      target: prod
      locks: [content:production, deployment:production]
      approval:
        message: Approve activation of the exact candidate
        match: ACTIVATE
        automation: denied
      snapshot:
        mode: verify
        recovery: manual
        refs:
          - kind: branch
            ref: refs/heads/environments/production
      steps:
        prepare:
          - use: verify-auth
            with: { required: true }
          - use: check-asset-store
          - use: build
            with: { mode: release }
          - use: prune-output
          - use: normalize-output
        verify:
          - use: verify-data
          - use: verify-offline-output
          - use: select-files
          - use: verify-content-inputs
          - use: run-smoke-tests
            with: { suite: full }
          - use: verify-live-site
          - use: verify-published-content
        cleanup:
          - use: remove-unused-files

  commands:
    verify-auth:
      effect: inspection
      command: node
      args: [scripts/verify-credentials.mjs, --required, '{required}']
      inspectionOnly: true
      timeout: 5m

    check-asset-store:
      command: node
      args: [scripts/check-resource.mjs, content-assets]
      timeout: 5m

    migrate-data:
      effect: change
      command: node
      args: [scripts/migrate-data.mjs]
      timeout: 30m

    verify-data:
      effect: verification
      command: node
      args: [scripts/verify-data.mjs, --record, '.azure/promote/verification/{workflow}-data.json']
      verification:
        path: '.azure/promote/verification/{workflow}-data.json'
      timeout: 10m

    build:
      command: node
      args: [scripts/build-content-app.mjs, --mode, '{mode}']
      timeout: 30m

    prune-output:
      command: node
      args: [scripts/prune-output.mjs, dist/content-app]
      timeout: 10m

    normalize-output:
      command: node
      args: [scripts/normalize-output.mjs, dist/content-app]
      timeout: 10m

    validate-content:
      command: node
      args:
        [
          scripts/validate-content-app.mjs,
          --artifact,
          '{artifact}',
          --environment,
          '{environment}',
        ]
      timeout: 30m

    verify-offline-output:
      effect: verification
      command: node
      args:
        [
          scripts/verify-offline-output.mjs,
          --record,
          '.azure/promote/verification/{workflow}-offline-output.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-offline-output.json'
      timeout: 10m

    publish-assets:
      effect: change
      command: node
      args:
        [
          scripts/publish-assets.mjs,
          --source,
          public/assets,
          --target,
          https://assets.example.invalid,
          --export-dir,
          dist/content-app,
          --skip-existing,
        ]
      timeout: 1h

    select-files:
      effect: verification
      command: node
      args:
        [
          scripts/select-files.mjs,
          --source,
          public/assets,
          --target,
          https://assets.example.invalid,
          --dry-run,
          --export-dir,
          dist/content-app,
          --selection-record,
          '.azure/promote/verification/{workflow}-selected-files.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-selected-files.json'
      timeout: 1h

    remove-unused-files:
      command: node
      args: [scripts/remove-unused-files.mjs, dist/content-app]
      timeout: 10m

    configure-asset-cors:
      effect: change
      command: node
      args: [scripts/configure-asset-cors.mjs, content-assets]
      timeout: 10m

    run-smoke-tests:
      effect: verification
      command: node
      args:
        [
          scripts/run-smoke-tests.mjs,
          --suite,
          '{suite}',
          --record,
          '.azure/promote/verification/{workflow}-smoke.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-smoke.json'
      timeout: 15m

    verify-live-site:
      effect: verification
      command: node
      args:
        [
          scripts/verify-live-site.mjs,
          --record,
          '.azure/promote/verification/{workflow}-live-site.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-live-site.json'
      timeout: 15m

    prepare-production-data:
      effect: change
      command: node
      args: [scripts/prepare-production-data.mjs]
      timeout: 30m

    verify-publisher-approval:
      effect: verification
      command: node
      args:
        [
          scripts/verify-publisher-approval.mjs,
          --record,
          '.azure/promote/verification/{workflow}-publisher-approval.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-publisher-approval.json'
      timeout: 5m

    prepare-production-release:
      effect: change
      command: node
      args: [scripts/prepare-production-release.mjs]
      timeout: 30m

    verify-deployment-inputs:
      effect: verification
      command: node
      args:
        [
          scripts/verify-deployment-inputs.mjs,
          --record,
          '.azure/promote/verification/{workflow}-deployment-inputs.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-deployment-inputs.json'
      timeout: 10m

    verify-published-content:
      effect: verification
      command: node
      args:
        [
          scripts/verify-published-content.mjs,
          --record,
          '.azure/promote/verification/{workflow}-published-content.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-published-content.json'
      timeout: 10m

    verify-prepared-content:
      effect: verification
      command: node
      args:
        [
          scripts/verify-prepared-content.mjs,
          --record,
          '.azure/promote/verification/{workflow}-prepared-content.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-prepared-content.json'
      timeout: 10m

    verify-content-inputs:
      effect: verification
      command: node
      args:
        [
          scripts/verify-content-inputs.mjs,
          --record,
          '.azure/promote/verification/{workflow}-content-inputs.json',
        ]
      verification:
        path: '.azure/promote/verification/{workflow}-content-inputs.json'
      timeout: 10m
