packages:
  - .

minimumReleaseAge: 4320
shamefullyHoist: true

allowBuilds:
  esbuild: true
  sharp: true

# @jongio/azd-web-core is our own first-party package, released from a repo we
# control. The release-age cooldown exists to blunt supply-chain attacks via
# compromised third-party publishes, so it buys us nothing here and would stall
# every core release for three days.
minimumReleaseAgeExclude:
  - '@jongio/azd-web-core'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <8'

overrides:
  picomatch: '>=2.3.2'
  lodash: '>=4.18.0'
  # GHSA-hrr3-gc8f-f4qj and GHSA-jvvf-x445-j334; remove when all AJV
  # consumers resolve a patched fast-uri without this override.
  fast-uri: '4.2.1'
  devalue: '>=5.9.1'
  nanoid: '>=3.3.18'
  # GHSA-r4xh-jqrq-34v2; remove when Astro's TOML consumers resolve >=1.9.0.
  smol-toml: '1.9.0'
  # GHSA-ch52-4w7c-c8xp; remove when Astro resolves >=4.3.0.
  http-cache-semantics: '4.3.0'
  # GHSA-68fv-2mgg-jv7q; remove when all build tools resolve >=1.2.2.
  source-map-js: '1.2.2'
  # GHSA-wq5f-xc86-pv6w; remove when Astro resolves sharp >=0.35.5.
  sharp: '0.35.5'
  svgo: '>=4.1.0'
  yaml: '2.9.1'
  # astro depends on js-yaml ^4.1.1. A 5.x override breaks the build, so this
  # override is capped below 5. The floor is 4.3.2 because GHSA-mh29-5h37-fv8m
  # affects >=4.0.0 <4.3.2.
  js-yaml: '>=4.3.2 <5'
  # @napi-rs/wasm-runtime declares its emnapi peers as '^1.7.1 || ^2.0.0-alpha.3'.
  # With autoInstallPeers, `pnpm update --latest` resolves those to the 2.0.0 alpha.
  # Pin to the latest stable release instead.
  '@emnapi/core': '1.11.3'
  '@emnapi/runtime': '1.11.3'
  '@astrojs/check': '0.9.10'
